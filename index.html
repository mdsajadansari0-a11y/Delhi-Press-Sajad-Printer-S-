<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajad Printer's - Design Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide scrollbar for category menu */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Top Navbar (Home Left, Login Right) -->
    <nav class="bg-white shadow-sm py-3 px-4 md:px-6 flex justify-between items-center sticky top-0 z-50">
        
        <!-- Left Side: Home Button -->
        <a href="index.html" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-200 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Home
        </a>

        <!-- Right Side: Login Button -->
        <a href="login.html" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 shadow-md transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
            Login
        </a>
    </nav>

    <!-- Main Store Content -->
    <main class="max-w-6xl mx-auto px-4 py-10">
        
        <!-- BIG Header Section -->
        <div class="text-center mb-10">
            <span class="bg-blue-100 text-blue-800 text-xs px-4 py-1.5 rounded-full font-bold tracking-widest mb-4 inline-block uppercase">Delhi Press • Sajad Printer's</span>
            <h1 class="text-4xl md:text-6xl font-extrabold text-gray-900 mb-4 tracking-tight">
                🛍️ Design Store
            </h1>
            <p class="text-gray-500 max-w-lg mx-auto text-sm md:text-base">Apna pasandida design chunein aur sidhe WhatsApp par order karein.</p>
        </div>

        <!-- Search Bar -->
        <div class="max-w-3xl mx-auto mb-6">
            <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-200 flex items-center">
                <svg class="w-6 h-6 text-gray-400 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchInput" placeholder="Design search karein (jaise: Wedding, Poster)..." class="w-full px-4 py-3 outline-none text-gray-700 bg-transparent md:text-lg" onkeyup="searchProducts()">
            </div>
        </div>

        <!-- Categories Menu (Scrollable) -->
        <div class="max-w-4xl mx-auto flex gap-2 overflow-x-auto no-scrollbar justify-start md:justify-center pb-6 px-1 mb-6" id="categoryMenu">
            <button onclick="filterCategory('All')" class="category-btn active px-6 py-2.5 rounded-full text-sm font-bold whitespace-nowrap bg-blue-600 text-white shadow-md transition-all">All Designs</button>
            <button onclick="filterCategory('Muslim wedding card design')" class="category-btn px-6 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all">Muslim Wedding Card</button>
            <button onclick="filterCategory('Hindu Card Design')" class="category-btn px-6 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all">Hindu Card</button>
            <button onclick="filterCategory('Nikah Nama')" class="category-btn px-6 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all">Nikah Nama</button>
            <button onclick="filterCategory('Visiting card')" class="category-btn px-6 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all">Visiting Card</button>
            <button onclick="filterCategory('Poster')" class="category-btn px-6 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all">Poster</button>
        </div>

        <!-- Products List Header -->
        <div class="mb-6 flex justify-between items-end border-b border-gray-200 pb-3">
            <h3 class="text-xl md:text-2xl font-bold text-gray-800">Hamare Designs</h3>
            <span id="productCount" class="text-sm font-medium text-gray-500 bg-gray-200 px-3 py-1 rounded-full">Loading...</span>
        </div>

        <!-- Product Cards Grid -->
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 min-h-[40vh]">
            <!-- Loading Message -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
                <svg class="animate-spin h-10 w-10 mb-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <p class="font-medium">Fetching designs from database...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-center py-8 border-t-4 border-blue-600 mt-10">
        <h4 class="text-white font-bold text-lg mb-1">Delhi Press - Sajad Printer's</h4>
        <p class="text-gray-400 text-sm">Professional Printing & Graphic Designing</p>
        <p class="text-gray-500 text-xs mt-4">© 2026 All Rights Reserved</p>
    </footer>

    <!-- Database Connection Javascript -->
    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://vgblvfpzpxivwafuatcy.supabase.co';
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnYmx2ZnB6cHhpdndhZnVhdGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjA0MzQsImV4cCI6MjEwMTA5NjQzNH0.YX7aVMsiP5Lj9c29QE1qifjNo_CRiS7nQ1_VMC4hL-c';
        const TABLE_NAME = 'products'; 
        
        // WhatsApp Number Configuration (Apna number dalein)
        const WHATSAPP_NUMBER = '919304509464'; 

        let allProducts = []; 

        async function fetchProducts() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*&order=created_at.desc`, {
                    headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
                });
                
                if (!response.ok) throw new Error("Network error");
                
                allProducts = await response.json();
                renderProducts(allProducts);
            } catch (error) {
                document.getElementById('productsGrid').innerHTML = `<div class="col-span-full text-center py-10 text-red-500 font-bold">Error loading products. Please check your connection.</div>`;
            }
        }

        function renderProducts(productsToDisplay) {
            const grid = document.getElementById('productsGrid');
            const count = document.getElementById('productCount');
            
            count.innerText = `${productsToDisplay.length} Design${productsToDisplay.length !== 1 ? 's' : ''}`;

            if(productsToDisplay.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 text-lg">No designs found.</div>`;
                return;
            }

            grid.innerHTML = productsToDisplay.map(product => {
                const msg = encodeURIComponent(`Hello Sajad Printer's! Mujhe ye design banwana hai: \n\nName: ${product.item_name}\nModel: ${product.card_model || 'N/A'}\nPrice: ₹${product.price}\n\nImage: ${product.image_url}`);
                
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col h-full group">
                    <div class="relative overflow-hidden aspect-[4/5] bg-gray-100">
                        <img src="${product.image_url}" alt="${product.item_name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-2 right-2 bg-white/90 backdrop-blur text-gray-900 text-xs font-bold px-2 py-1 rounded shadow-sm border border-gray-100">
                            ₹${product.price}
                        </div>
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow">
                        <span class="text-[10px] font-black text-blue-600 uppercase tracking-wider mb-1 line-clamp-1">${product.category}</span>
                        <h4 class="font-bold text-gray-900 mb-1 leading-tight line-clamp-2">${product.item_name}</h4>
                        <p class="text-xs text-gray-500 mb-4 line-clamp-2">${product.description || 'Premium design card.'}</p>
                        
                        <div class="mt-auto pt-3 border-t border-gray-50">
                            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${msg}" target="_blank" class="w-full bg-[#25D366] text-white py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-[#1ebe57] hover:shadow-lg transition-all flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.015c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                                Order Now
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterCategory(categoryName) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                if(btn.innerText.includes(categoryName) || (categoryName === 'All' && btn.innerText === 'All Designs')) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-white', 'text-gray-600');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('bg-white', 'text-gray-600');
                }
            });

            if(categoryName === 'All') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === categoryName);
                renderProducts(filtered);
            }
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.item_name.toLowerCase().includes(query) || 
                (p.description && p.description.toLowerCase().includes(query)) ||
                (p.category && p.category.toLowerCase().includes(query))
            );
            renderProducts(filtered);
        }

        window.onload = fetchProducts;
    </script>
</body>
</html>
