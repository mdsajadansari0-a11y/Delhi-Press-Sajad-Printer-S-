<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sajaad Printers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f7fe; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #0f172a; color: #fff; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 20px; font-size: 20px; font-weight: 700; color: #38bdf8; border-bottom: 1px solid #1e293b; }
        .sidebar-menu { list-style: none; padding: 20px 0; flex: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: #94a3b8; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .sidebar-menu li.active a, .sidebar-menu li a:hover { background: #1e293b; color: #fff; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .header h2 { font-size: 22px; color: #1e293b; }
        
        .container { padding: 30px; max-width: 900px; }
        .form-card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
        .form-title { font-size: 18px; font-weight: 600; color: #1e293b; margin-bottom: 20px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: 1 / -1; }
        
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        textarea { resize: vertical; height: 100px; }
        
        .upload-box { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 25px; text-align: center; background: #f8fafc; cursor: pointer; transition: 0.2s; }
        .upload-box:hover { border-color: #3b82f6; background: #f1f5f9; }
        .upload-box i { font-size: 32px; color: #3b82f6; margin-bottom: 8px; }
        .upload-box p { font-size: 13px; color: #64748b; }
        
        .submit-btn { background: #4f46e5; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .submit-btn:hover { background: #4338ca; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">Sajaad Printers</div>
        <ul class="sidebar-menu">
            <li class="active"><a href="admin.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="all-cards.html"><i class="fa-solid fa-address-card"></i> All Cards</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Add New Design</h2>
            <span style="color: #10b981; font-weight: 600; font-size: 14px;"><i class="fa-solid fa-circle" style="font-size: 10px;"></i> System Active</span>
        </div>

        <div class="container">
            <div class="form-card">
                <div class="form-title">Product Details</div>
                <form id="uploadForm" onsubmit="saveCard(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Item Name *</label>
                            <input type="text" id="itemName" placeholder="e.g. Royal Gold Wedding Card" required>
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="itemCategory" required>
                                <option value="">Select Category</option>
                                <option value="Wedding Card">Wedding Card</option>
                                <option value="Visiting Card">Visiting Card</option>
                                <option value="Flex Banner">Flex Banner</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Card Model (Optional)</label>
                            <input type="text" id="itemModel" placeholder="e.g. Model-XZ200">
                        </div>
                        <div class="form-group">
                            <label>Price (₹) *</label>
                            <input type="number" id="itemPrice" placeholder="0.00" required>
                        </div>
                        <div class="form-group full">
                            <label>Description</label>
                            <textarea id="itemDesc" placeholder="Write details about paper quality, design, etc..."></textarea>
                        </div>
                        <div class="form-group full">
                            <label>Upload Image *</label>
                            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <p><strong>Click to upload</strong> or drag and drop</p>
                                <span id="fileName" style="font-size: 12px; color: #059669; margin-top: 5px; display:block;">PNG, JPG or JPEG</span>
                            </div>
                            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn"><i class="fa-solid fa-upload"></i> Save & Upload to Database</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let uploadedImageBase64 = "";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').innerText = "Selected: " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveCard(event) {
            event.preventDefault();
            
            const name = document.getElementById('itemName').value;
            const category = document.getElementById('itemCategory').value;
            const price = document.getElementById('itemPrice').value;
            const desc = document.getElementById('itemDesc').value;

            if (!uploadedImageBase64) {
                alert('Kripya ek image select karein!');
                return;
            }

            const newCard = {
                name,
                category,
                price,
                desc,
                image: uploadedImageBase64
            };

            let cards = JSON.parse(localStorage.getItem('adminCards')) || [];
            cards.push(newCard);
            localStorage.setItem('adminCards', JSON.stringify(cards));

            alert('Card successfully upload ho gaya!');
            window.location.href = 'all-cards.html';
        }
    </script>
</body>
</html>
