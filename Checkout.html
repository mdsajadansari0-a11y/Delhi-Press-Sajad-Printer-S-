<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Delhi Press (Sajad Printer'S)</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
color:#0d6efd;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.order-box{
background:#f8f8f8;
padding:15px;
border-radius:8px;
margin:15px 0;
}

.order-box h3{
margin-bottom:10px;
}

.total{
font-size:22px;
font-weight:bold;
color:#28a745;
}

button{
width:100%;
padding:15px;
border:none;
background:#0d6efd;
color:#fff;
font-size:18px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#084298;
}
</style>

</head>
<body>

<div class="container">

<h2>Checkout</h2>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="email" placeholder="Email">

<textarea placeholder="Full Address"></textarea>

<div class="order-box">
<h3>Order Summary</h3>

<p>Product : <b id="product">Sample Design</b></p>

<p>Quantity : <b>1</b></p>

<p class="total">Total : ₹<span id="price">100</span></p>

</div>

<button onclick="payNow()">
Pay Now
</button>

</div>

<script>

function payNow(){

alert("Cashfree Payment Button / Checkout Integration yahan connect hoga.");

}

</script>

</body>
</html>
