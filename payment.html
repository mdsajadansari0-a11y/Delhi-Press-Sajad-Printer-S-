<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8e16c4">

<title>Sajad Printer - UPI Payment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(145deg,#7200a8,#bd00e8);
    padding:18px 10px;
}

.payment-card{
    width:100%;
    max-width:430px;
    margin:auto;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 15px 45px rgba(0,0,0,.28);
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#8011b5,#bd00e8);
    color:#fff;
    text-align:center;
    padding:24px 15px;
}

.logo{
    font-size:44px;
    font-weight:900;
}

.header h1{
    font-size:23px;
    margin-top:7px;
}

.header p{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}

/* MAIN */
.content{
    padding:22px;
}

.secure-wrap{
    text-align:center;
}

.secure{
    display:inline-block;
    background:#e5f8ec;
    color:#07883d;
    padding:8px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
}

.scan-title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#222;
    margin-top:20px;
}

.scan-sub{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:5px;
}

/* QR */
.qr-box{
    max-width:310px;
    margin:18px auto;
    padding:8px;
    border:2px solid #eee;
    border-radius:20px;
    background:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.qr-box img{
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
}

/* DETAILS */
.details{
    background:#faf7fc;
    border:1px solid #eadcf1;
    border-radius:17px;
    padding:16px;
    margin-top:15px;
}

.label{
    font-size:11px;
    color:#888;
    margin-bottom:4px;
}

.value{
    font-size:17px;
    font-weight:bold;
    color:#222;
    margin-bottom:15px;
}

.upi{
    color:#9619c7;
}

/* COPY */
.copy-btn{
    width:100%;
    padding:13px;
    border:2px solid #9619c7;
    background:#fff;
    color:#9619c7;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

#copyMsg{
    display:none;
    color:#07883d;
    text-align:center;
    font-size:12px;
    margin-top:8px;
}

/* AMOUNT BOX */
.amount-section{
    margin-top:20px;
}

.amount-label{
    font-size:13px;
    color:#555;
    font-weight:bold;
}

.amount-box{
    margin-top:8px;
    display:flex;
    align-items:center;
    background:#fff;
    border:2px solid #9b18c7;
    border-radius:15px;
    overflow:hidden;
}

.rupee{
    padding-left:17px;
    font-size:29px;
    font-weight:bold;
    color:#222;
}

.amount-box input{
    width:100%;
    border:none;
    outline:none;
    padding:16px 12px;
    font-size:22px;
    font-weight:bold;
    color:#222;
    background:transparent;
}

.amount-box input::placeholder{
    color:#aaa;
    font-size:16px;
}

/* PAY BUTTON */
.pay-btn{
    width:100%;
    border:none;
    margin-top:17px;
    padding:17px;
    border-radius:14px;
    background:linear-gradient(135deg,#8113b5,#b900df);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 7px 18px rgba(145,20,190,.3);
}

.pay-btn:active{
    transform:scale(.98);
}

.quick
