<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sajad Printer'S - Admin Panel</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
.header{background:linear-gradient(135deg,#063b70,#0089d9);color:white;padding:22px 15px;text-align:center}
.header h1{margin:0;font-size:25px}
.header p{margin:6px 0 0;font-size:13px}
.container{max-width:650px;margin:25px auto;padding:0 12px}
.box{background:white;padding:20px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.10)}
.title{text-align:center;font-size:23px;font-weight:bold;margin-bottom:20px;color:#073665}
.form-group{margin-bottom:15px}
label{display:block;font-size:12px;font-weight:bold;color:#555;margin-bottom:6px}
input,select,textarea{
width:100%;border:1px solid #ccc;border-radius:10px;padding:13px;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border:2px solid #0785d1}
textarea{min-height:80px}
.preview{text-align:center;margin:12px 0;display:none}
.preview img{max-width:220px;max-height:280px;border-radius:12px}
.upload-btn{
width:100%;border:0;padding:15px;border-radius:12px;background:#087ec1;color:white;
font-size:17px;font-weight:bold;cursor:pointer}
.upload-btn:disabled{background:#999}
.back{
display:block;margin-top:12px;text-align:center;padding:13px;border:2px solid #087ec1;
color:#087ec1;border-radius:12px;text-decoration:none;font-weight:bold}
.status{display:none;margin-top:15px;padding:13px;border-radius:10px;text-align:center;font-weight:bold}
.success{background:#e5f8eb;color:#087a39}
.error{background:#ffe8e8;color:#b42318}
.design-list{margin-top:30px}
.design-item{
background:#fafafa;border:1px solid #eee;padding:10px;border-radius:12px;margin-top:10px;
display:flex;gap:10px;align-items:center}
.design-item img{width:65px;height:80px;object-fit:cover;border-radius:8px;background:#eee}
.design-info{flex:1;font-size:13px}
.design-info b{display:block;font-size:14px;margin-bottom:4px}
.delete-btn{border:0;background:#d32f2f;color:white;padding:9px;border-radius:8px;cursor:pointer}
footer{text-align:center;padding:25px;color:#777;font-size:11px}
</style>
</head>

<body>

<div class="header">
<h1>🔐 Sajad Printer'S Admin</h1>
<p>Supabase Design Store Management</p>
</div>

<div class="container">
<div class="box">

<div class="title">➕ Add New Design</div>

<div class="form-group">
<label>DESIGN NAME</label>
<input id="designName" type="text" placeholder="Example: Premium Nikah Card">
</div>

<div class="form-group">
<label>CATEGORY</label>
<select id="category">
<option>Wedding Card</option>
<option>Nikah Card</option>
<option>Muslim Card</option>
<option>Aqiqah</option>
<option>Flex Banner</option>
<option>Visiting Card</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>PRICE ₹</label>
<input id="price" type="number" min="0" placeholder="Example: 99">
</div>

<div class="form-group">
<label>DESCRIPTION</label>
<textarea id="description" placeholder="Design के बारे में लिखें"></textarea>
</div>

<div class="form-group">
<label>DESIGN PHOTO</label>
<input id="designImage" type="file" accept="image/*" onchange="previewImage()">
</div>

<div class="preview" id="previewBox">
<img id="previewPhoto">
</div>

<button id="saveBtn" class="upload-btn" onclick="saveDesign()">
📤 Upload & Add Design
</button>

<div id="status" class="status"></div>

<a class="back" href="store.html">
← View Design Store
</a>

<div class="design-list">
<h2>📦 Saved Products</h2>
<div id="designList">Loading...</div>
</div>

</div>
</div>

<footer>Delhi Press - Sajad Printer'S Admin Panel</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://vgblvfpzpxivwafuatcy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u4PJUGojT-BQfg65WaYTFw_Gdx-MLOH";

const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const BUCKET="design-images";


function previewImage(){

const file=document.getElementById("designImage").files[0];

if(!file)return;

document.getElementById("previewPhoto").src=
URL.createObjectURL(file);

document.getElementById("previewBox").style.display="block";
}


function showStatus(message,type){

const status=document.getElementById("status");

status.innerHTML=message;
status.className="status "+type;
status.style.display="block";
}


async function saveDesign(){

const name=document.getElementById("designName").value.trim();
const category=document.getElementById("category").value;
const price=document.getElementById("price").value;
const description=document.getElementById("description").value.trim();
const file=document.getElementById("designImage").files[0];

if(!name){
alert("Design Name डालें");
return;
}

if(price===""){
alert("Price डालें");
return;
}

if(!file){
alert("Design Photo चुनें");
return;
}

const btn=document.getElementById("saveBtn");

btn.disabled=true;
btn.innerHTML="⏳ Uploading...";

try{

/* UNIQUE FILE NAME */

const extension=
file.name.split(".").pop().toLowerCase();

const fileName=
Date.now()+"-"+Math.random().toString(36).substring(2,8)+"."+extension;


/* UPLOAD IMAGE */

const {error:uploadError}=
await db.storage
.from(BUCKET)
.upload(fileName,file,{
cacheControl:"3600",
upsert:false
});

if(uploadError){
throw uploadError;
}


/* PUBLIC URL */

const {data:urlData}=
db.storage
.from(BUCKET)
.getPublicUrl(fileName);

const imageUrl=urlData.publicUrl;


/* INSERT PRODUCT */

const {error:insertError}=
await db
.from("products")
.insert([{
name:name,
price:Number(price),
image_url:imageUrl,
category:category,
description:description
}]);

if(insertError){

/* अगर product save fail हो तो uploaded photo हटाने की कोशिश */

await db.storage
.from(BUCKET)
.remove([fileName]);

throw insertError;
}


showStatus("✅ Design successfully added!","success");

clearForm();

await loadProducts();

}
catch(error){

console.error(error);

showStatus(
"❌ Error: "+(error.message || "Design save नहीं हुआ"),
"error"
);

}
finally{

btn.disabled=false;
btn.innerHTML="📤 Upload & Add Design";

}

}


function clearForm(){

document.getElementById("designName").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("designImage").value="";
document.getElementById("previewBox").style.display="none";

}


/* LOAD PRODUCTS */

async function loadProducts(){

const list=document.getElementById("designList");

list.innerHTML="⏳ Loading...";

const {data,error}=
await db
.from("products")
.select("*")
.order("id",{ascending:false});

if(error){

list.innerHTML="❌ Products load नहीं हुए";

console.error(error);

return;
}

if(!data || data.length===0){

list.innerHTML="<p>अभी कोई Product नहीं है।</p>";

return;
}

list.innerHTML="";

data.forEach(product=>{

const item=document.createElement("div");

item.className="design-item";

item.innerHTML=`

<img src="${escapeHTML(product.image_url || "")}">

<div class="design-info">

<b>${escapeHTML(product.name || "Design")}</b>

${escapeHTML(product.category || "")}
<br>

<strong>₹${escapeHTML(String(product.price || 0))}</strong>

</div>

<button
class="delete-btn"
onclick="deleteProduct(${Number(product.id)})">

🗑 Delete

</button>

`;

list.appendChild(item);

});

}


/* DELETE */

async function deleteProduct(id){

if(!confirm("यह Product Delete करना है?")){
return;
}

const {error}=
await db
.from("products")
.delete()
.eq("id",id);

if(error){

alert("Delete नहीं हुआ: "+error.message);

return;
}

showStatus("✅ Product Deleted","success");

loadProducts();

}


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


loadProducts();

</script>

</body>
</html>
