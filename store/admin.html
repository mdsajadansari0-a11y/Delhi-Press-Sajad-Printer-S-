<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sajad Printer Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#0f62fe;
color:#fff;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:8px;
background:#0f62fe;
color:#fff;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0047c7;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<header>
Sajad Printer Admin Panel
</header>

<div class="container">

<label>Design Title</label>
<input id="title">

<label>Design Number</label>
<input id="design_no">

<label>Category</label>

<select id="category">

<option>Wedding Card</option>
<option>Nikah Card</option>
<option>Muslim Card</option>
<option>Aqiqah</option>
<option>Visiting Card</option>
<option>Flex Banner</option>

</select>

<label>Price</label>
<input id="price" type="number">

<label>Description</label>
<textarea id="description"></textarea>

<label>Upload Image</label>
<input id="imageFile" type="file" accept="image/*">

<button onclick="saveDesign()">
Save Design
</button>

<div id="status"></div>

</div><script>

const supabase = window.supabase.createClient(
"https://vgblvfpzpxivwafuatcy.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnYmx2ZnB6cHhpdndhZnVhdGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjA0MzQsImV4cCI6MjEwMTA5NjQzNH0.YX7aVMsiP5Lj9c29QE1qifjNo_CRiS7nQ1_VMC4hL-c"
);

async function checkLogin(){

const { data } = await supabase.auth.getSession();

if(!data.session){
window.location.href="login.html";
return;
}

}

checkLogin();

async function saveDesign(){

const status=document.getElementById("status");

const file=document.getElementById("imageFile").files[0];

if(!file){

status.innerHTML="Please select image";

return;

}

const fileName=Date.now()+"_"+file.name;

const upload=await supabase.storage
.from("design-images")
.upload(fileName,file);

if(upload.error){

status.innerHTML=upload.error.message;

return;

}

const image_url=supabase.storage
.from("design-images")
.getPublicUrl(fileName)
.data.publicUrl;const { error } = await supabase
.from("designs")
.insert([{
title:document.getElementById("title").value,
design_no:document.getElementById("design_no").value,
category:document.getElementById("category").value,
price:Number(document.getElementById("price").value),
description:document.getElementById("description").value,
image_url:image_url
}]);

if(error){

status.innerHTML=error.message;

return;

}

status.innerHTML="✅ Design Saved Successfully";

document.getElementById("title").value="";
document.getElementById("design_no").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("imageFile").value="";

}

</script>

</body>
</html>
