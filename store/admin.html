<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delhi Press - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#06366a;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:900px;
margin:25px auto;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h2{
margin-bottom:20px;
color:#06366a;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:vertical;
}

button{
margin-top:20px;
width:100%;
padding:14px;
background:#00b95c;
border:none;
color:#fff;
font-size:17px;
font-weight:bold;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#009b4c;
}

#status{
margin-top:20px;
padding:12px;
border-radius:8px;
display:none;
font-weight:bold;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

</style>
</head>

<body>

<header>

Delhi Press - Sajad Printer'S
<br>
Admin Panel

</header>

<div class="container">

<h2>Add New Design</h2>

<label>Design Title</label>
<input id="title">

<label>Design Number</label>
<input id="design_no">

<label>Category</label>

<select id="category">

<option>Wedding Card</option>

<option>Nikah Card</option>

<option>Muslim Card</option>

<option>Aqiqah</option>

<option>Visiting Card</option>

<option>Flex Banner</option>

</select><label>Price</label>
<input type="number" id="price">

<label>Image URL</label>
<input id="image_url" placeholder="https://...">

<label>Description</label>
<textarea id="description"></textarea>

<button onclick="saveDesign()">
💾 Save Design
</button>

<div id="status"></div>

</div>

<script>

const SUPABASE_URL =
"https://vgblvfpzpxivwafuatcy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u4PJUGojT-BQfg65WaYTFw_Gdx-MLOH";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function saveDesign(){

const title =
document.getElementById("title").value.trim();

const design_no =
document.getElementById("design_no").value.trim();

const category =
document.getElementById("category").value;

const price =
Number(document.getElementById("price").value);

const image_url =
document.getElementById("image_url").value.trim();

const description =
document.getElementById("description").value.trim();

const status =
document.getElementById("status");

status.style.display="block";

status.className="";

status.innerHTML="Saving...";const { data, error } = await supabase
.from("designs")
.insert([
{
title,
design_no,
category,
price,
image_url,
description
}
]);

if(error){

status.className="error";
status.innerHTML="❌ "+error.message;

return;

}

status.className="success";
status.innerHTML="✅ Design Saved Successfully";

document.getElementById("title").value="";
document.getElementById("design_no").value="";
document.getElementById("price").value="";
document.getElementById("image_url").value="";
document.getElementById("description").value="";

}

</script>

</body>
</html>
