<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sajad Printer'S Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}
header{
background:#6a1b9a;
color:#fff;
padding:18px;
text-align:center;
}
main{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:10px;
}
label{
display:block;
margin-top:12px;
font-weight:bold;
}
input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
box-sizing:border-box;
}
button{
margin-top:18px;
padding:12px 18px;
background:#6a1b9a;
color:#fff;
border:0;
border-radius:8px;
cursor:pointer;
font-size:16px;
}
button:hover{
background:#4a148c;
}
</style>
</head>

<body>

<header>
<h2>Sajad Printer'S Admin Panel</h2>
</header>

<main>

<h3>Add Product</h3>

<label>Product Name</label>
<input id="name">

<label>Category</label>
<select id="category">
<option>Wedding Card</option>
<option>Nikah Card</option>
<option>Muslim Card</option>
<option>Aqiqah</option>
<option>Flex Banner</option>
<option>Visiting Card</option>
</select>

<label>Price</label>
<input id="price" type="number">

<label>Description</label>
<textarea id="description"></textarea>

<label>Image URL</label>
<input id="image">

<button onclick="saveProduct()">Save Product</button>

</main>

<script>

const SUPABASE_URL="https://vgblvfpzpxivvwafuaty.supabase.co";

const SUPABASE_KEY="sb_publishable_u4PJUGojT-BQfg65WaYTFw_Gdx-MLOH";

const supabase=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function saveProduct(){

const product={

name:document.getElementById("name").value,

category:document.getElementById("category").value,

price:Number(document.getElementById("price").value),

description:document.getElementById("description").value,

image_url:document.getElementById("image").value

};

const {error}=await supabase
.from("products")
.insert([product]);

if(error){

alert(error.message);

}else{

alert("Product Saved Successfully");

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("image").value="";

}

}

</script>

</body>
</html>
