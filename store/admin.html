<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0f62fe;
color:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

header button{
width:auto;
padding:10px 18px;
background:red;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

.container{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
margin-top:20px;
padding:12px;
background:#0f62fe;
color:#fff;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<h2>Admin Dashboard</h2>

<button onclick="logout()">Logout</button>

</header>

<div class="container">

<label>Design Title</label>
<input id="title">

<label>Design Number</label>
<input id="design_no">

<label>Category</label>

<select id="category">
<option>Wedding Card</option>
<option>Nikah Card</option>
<option>Visiting Card</option>
<option>Flex Banner</option>
</select>

<label>Price</label>
<input type="number" id="price">

<label>Description</label>
<textarea id="description"></textarea>

<label>Image</label>
<input type="file" id="imageFile">

<button onclick="saveDesign()">Save Design</button>

<div id="status"></div>

</div><script>

const supabase = window.supabase.createClient(
"https://vgblvfpzpxivwafuatcy.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnYmx2ZnB6cHhpdndhZnVhdGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjA0MzQsImV4cCI6MjEwMTA5NjQzNH0.YX7aVMsiP5Lj9c29QE1qifjNo_CRiS7nQ1_VMC4hL-c"
);

async function checkLogin(){

const { data } = await supabase.auth.getSession();

if(!data.session){
location.href="login.html";
return;
}

}

checkLogin();

async function logout(){

await supabase.auth.signOut();

location.href="login.html";

}

async function saveDesign(){

const status=document.getElementById("status");

const file=document.getElementById("imageFile").files[0];

if(!file){
status.innerHTML="Please select image";
return;
}

const fileName=Date.now()+"_"+file.name;

const upload=await supabase.storage
.from("design-images")
.upload(fileName,file);

if(upload.error){
status.innerHTML=upload.error.message;
return;
}

const image_url=supabase.storage
.from("design-images")
.getPublicUrl(fileName)
.data.publicUrl;const { error } = await supabase
.from("designs")
.insert([{
title:document.getElementById("title").value,
design_no:document.getElementById("design_no").value,
category:document.getElementById("category").value,
price:Number(document.getElementById("price").value),
description:document.getElementById("description").value,
image_url:image_url
}]);

if(error){
status.innerHTML=error.message;
return;
}

status.innerHTML="✅ Design Saved Successfully";

document.getElementById("title").value="";
document.getElementById("design_no").value="";
document.getElementById("category").selectedIndex=0;
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("imageFile").value="";

}

</script>

</body>
</html>
