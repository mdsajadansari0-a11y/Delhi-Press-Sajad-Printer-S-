<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sajad Printer'S Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#6a1b9a;color:#fff;padding:16px;text-align:center}
main{max-width:700px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
label{display:block;margin-top:10px;font-weight:bold}
input,select,textarea{width:100%;padding:10px;box-sizing:border-box}
button{margin-top:16px;padding:12px;border:0;border-radius:8px;background:#6a1b9a;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><h2>Sajad Printer'S Admin Panel</h2></header>
<main>
<label>Product Name</label><input id="name">
<label>Category</label>
<select id="category">
<option>Wedding Card</option>
<option>Nikah Card</option>
<option>Muslim Card</option>
<option>Aqiqah</option>
<option>Flex Banner</option>
<option>Visiting Card</option>
</select>
<label>Price</label><input id="price" type="number">
<label>Description</label><textarea id="description"></textarea>
<label>Image URL</label><input id="image">
<button onclick="saveProduct()">Save Product</button>
</main>

<script>
const SUPABASE_URL="https://vgblvfpzpxivvwafuaty.supabase.co";
const SUPABASE_KEY="sb_publishable_u4PJUGojT-BQfg65WaYTFw_Gdx-MLOH";
const supabase = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function saveProduct(){
 const product={
  name:document.getElementById('name').value,
  category:document.getElementById('category').value,
  price:Number(document.getElementById('price').value),
  description:document.getElementById('description').value,
  image_url:document.getElementById('image').value
 };
 const {error}=await supabase.from('products').insert([product]);
 if(error){alert(error.message);}
 else{alert('Product Saved Successfully');}
}
</script>
</body>
</html>
