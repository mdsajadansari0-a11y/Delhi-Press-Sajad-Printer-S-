<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <span class="text-xl font-bold tracking-wide text-white">Sajad <span class="text-indigo-400">Printers</span></span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1">
            <a href="#" class="flex items-center px-4 py-3 bg-indigo-600 text-white rounded-xl font-medium shadow-md">Dashboard</a>
            <a href="#" class="flex items-center px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-xl font-medium transition">All Cards</a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <a href="index.html" class="flex justify-center w-full px-4 py-2 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white rounded-xl transition">Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative z-10 overflow-y-auto">
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-800">Add New Design</h2>
            <div class="flex items-center gap-2 text-sm text-green-600 bg-green-50 px-3 py-1 rounded-full font-medium border border-green-200">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> System Active
            </div>
        </header>

        <div class="p-8">
            
            <!-- ⭐ DATA ENTRY FORM ⭐ -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mb-8">
                <h3 class="font-bold text-gray-800 mb-6 text-xl border-b pb-4">Product Details</h3>
                
                <form id="uploadForm" class="space-y-6">
                    <!-- Text Inputs Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Item Name -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Item Name <span class="text-red-500">*</span></label>
                            <input type="text" id="itemName" placeholder="e.g. Royal Gold Wedding Card" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" required>
                        </div>
                        
                        <!-- Category Dropdown -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Category <span class="text-red-500">*</span></label>
                            <select id="itemCategory" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" required>
                                <option value="" disabled selected>Select Category</option>
                                <option value="Muslim wedding card design">Muslim wedding card design</option>
                                <option value="Hindu Card Design">Hindu Card Design</option>
                                <option value="Nikah Nama">Nikah Nama</option>
                                <option value="Poster">Poster</option>
                                <option value="Visiting card">Visiting card</option>
                                <option value="Wedding card Sample">Wedding card Sample</option>
                                <option value="Calendar">Calendar</option>
                            </select>
                        </div>

                        <!-- Card Model -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Card Model (Optional)</label>
                            <input type="text" id="cardModel" placeholder="e.g. Model-XZ200" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                        </div>

                        <!-- Price -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Price (₹)</label>
                            <input type="number" id="itemPrice" placeholder="0.00" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                        <textarea id="itemDescription" rows="3" placeholder="Write details about the paper quality, design, etc..." class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"></textarea>
                    </div>

                    <!-- Image Upload -->
                    <div class="mt-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Image <span class="text-red-500">*</span></label>
                        <div class="flex items-center justify-center w-full">
                            <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-40 border-2 border-indigo-200 border-dashed rounded-xl cursor-pointer bg-indigo-50/50 hover:bg-indigo-50 transition-all">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                    <svg class="w-10 h-10 mb-3 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                    <p class="mb-2 text-sm text-gray-600"><span class="font-semibold text-indigo-600">Click to upload</span></p>
                                    <p class="text-xs text-gray-500">PNG, JPG or JPEG</p>
                                </div>
                                <input id="dropzone-file" type="file" class="hidden" accept="image/*" onchange="previewImage(event)" required />
                            </label>
                        </div>
                    </div>

                    <!-- Image Preview -->
                    <div id="imagePreviewContainer" class="hidden flex flex-col items-start bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <p class="text-sm font-semibold text-gray-700 mb-3">Selected Image Preview:</p>
                        <img id="imagePreview" class="max-h-40 rounded-lg shadow-sm border border-gray-200 object-contain bg-white" src="" alt="Preview">
                        <button type="button" onclick="clearImage()" class="mt-3 text-sm text-red-500 hover:underline">Remove Image</button>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-4 pt-4 border-t border-gray-100">
                        <button type="submit" id="uploadBtn" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md flex items-center justify-center gap-2 w-full md:w-auto">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <span>Save & Upload to Database</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // --- Supabase Config ---
        const SUPABASE_URL = 'https://vgblvfpzpxivwafuatcy.supabase.co';
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnYmx2ZnB6cHhpdndhZnVhdGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjA0MzQsImV4cCI6MjEwMTA5NjQzNH0.YX7aVMsiP5Lj9c29QE1qifjNo_CRiS7nQ1_VMC4hL-c';
        
        // Zaroori: Aapko Supabase dashboard mein 'products' naam ki table aur 'images' naam ka bucket banana hoga
        const TABLE_NAME = 'products'; 
        const BUCKET_NAME = 'images'; 

        // --- Image Preview Logic ---
        function previewImage(event) {
            const input = event.target;
            const container = document.getElementById('imagePreviewContainer');
            const preview = document.getElementById('imagePreview');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    container.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearImage() {
            document.getElementById('dropzone-file').value = "";
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imagePreview').src = "";
        }

        // --- Upload Data Logic ---
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Page refresh hone se rokna
            
            const btn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('dropzone-file');
            const file = fileInput.files[0];

            if(!file) {
                alert("Please select an image first!");
                return;
            }

            // Button ko loading state me dalna
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Uploading...`;
            btn.disabled = true;

            try {
                // Step 1: Upload image to Supabase Storage
                const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                
                const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${fileName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'apikey': API_KEY,
                        'Content-Type': file.type
                    },
                    body: file
                });

                if(!uploadRes.ok) throw new Error("Image upload failed! Ensure 'images' bucket exists in Supabase and is public.");

                // Image ka public link banana
                const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${fileName}`;

                // Step 2: Save Text Data + Image URL to Database Table
                const productData = {
                    item_name: document.getElementById('itemName').value,
                    category: document.getElementById('itemCategory').value,
                    card_model: document.getElementById('cardModel').value,
                    price: parseFloat(document.getElementById('itemPrice').value) || 0,
                    description: document.getElementById('itemDescription').value,
                    image_url: imageUrl
                };

                const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'apikey': API_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(productData)
                });

                if(!dbRes.ok) throw new Error("Database save failed! Ensure 'products' table exists with correct columns.");

                // Success Hone Par
                alert("✅ Product Uploaded Successfully!");
                document.getElementById('uploadForm').reset();
                clearImage();

            } catch (error) {
                alert("❌ Error: " + error.message);
                console.error(error);
            } finally {
                // Button ko wapas normal karna
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> <span>Save & Upload to Database</span>`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
