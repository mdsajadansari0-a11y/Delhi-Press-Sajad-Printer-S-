<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <span class="text-xl font-bold tracking-wide text-white">MyStore <span class="text-indigo-400">Panel</span></span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1">
            <a href="#" class="flex items-center px-4 py-3 bg-indigo-600 text-white rounded-xl font-medium shadow-md">Dashboard</a>
            <a href="#" class="flex items-center px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-xl font-medium transition">Database Data</a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <a href="index.html" class="flex justify-center w-full px-4 py-2 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white rounded-xl transition">Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative z-10 overflow-y-auto">
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-800">Live API Data & Uploads</h2>
            <div class="flex items-center gap-2 text-sm text-green-600 bg-green-50 px-3 py-1 rounded-full font-medium border border-green-200">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Connected to Supabase
            </div>
        </header>

        <div class="p-8">
            
            <!-- ⭐ NEW: Premium Image Upload Section ⭐ -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
                <h3 class="font-bold text-gray-800 mb-4 text-lg">Upload New Image</h3>
                
                <!-- Drag & Drop Box -->
                <div class="flex items-center justify-center w-full">
                    <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-48 border-2 border-indigo-200 border-dashed rounded-xl cursor-pointer bg-indigo-50/50 hover:bg-indigo-50 transition-all">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-12 h-12 mb-3 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="mb-2 text-sm text-gray-600"><span class="font-semibold text-indigo-600">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-gray-500">SVG, PNG, JPG or GIF (MAX. 5MB)</p>
                        </div>
                        <!-- Hidden File Input -->
                        <input id="dropzone-file" type="file" class="hidden" accept="image/*" onchange="previewImage(event)" />
                    </label>
                </div>

                <!-- Image Preview Area (Hidden until image is selected) -->
                <div id="imagePreviewContainer" class="hidden mt-6 flex flex-col items-start bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <p class="text-sm font-semibold text-gray-700 mb-3">Selected Image Preview:</p>
                    <img id="imagePreview" class="max-h-48 rounded-lg shadow-sm border border-gray-200 object-contain bg-white" src="" alt="Preview">
                    <div class="mt-4 flex gap-3">
                        <button class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-sm font-bold hover:bg-indigo-700 transition shadow-md shadow-indigo-200 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Upload to Database
                        </button>
                        <button onclick="clearImage()" class="bg-white text-red-500 border border-red-200 px-6 py-2.5 rounded-lg text-sm font-bold hover:bg-red-50 transition">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>

            <!-- Data Table Area -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="font-bold text-gray-800">Recent Records</h3>
                    <button onclick="fetchData()" class="text-sm bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition font-medium">Refresh Data</button>
                </div>
                
                <div class="p-6">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-gray-400 text-sm border-b border-gray-100">
                                <th class="pb-3 font-medium">ID</th>
                                <th class="pb-3 font-medium">Name / Title</th>
                                <th class="pb-3 font-medium">Status</th>
                                <th class="pb-3 font-medium text-right">Created At</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <tr>
                                <td colspan="4" class="py-10 text-center text-gray-400">
                                    Fetching data from Supabase API...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Image Upload Preview Logic ---
        function previewImage(event) {
            const input = event.target;
            const container = document.getElementById('imagePreviewContainer');
            const preview = document.getElementById('imagePreview');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    container.classList.remove('hidden'); // Show preview container
                }
                
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearImage() {
            document.getElementById('dropzone-file').value = "";
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imagePreview').src = "";
        }

        // --- Supabase Data Fetching Logic (From previous step) ---
        const API_URL = 'https://vgblvfpzpxivwafuatcy.supabase.co/rest/v1';
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnYmx2ZnB6cHhpdndhZnVhdGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjA0MzQsImV4cCI6MjEwMTA5NjQzNH0.YX7aVMsiP5Lj9c29QE1qifjNo_CRiS7nQ1_VMC4hL-c';
        const TABLE_NAME = 'your_table_name'; 

        async function fetchData() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-gray-400">Loading live data...</td></tr>`;

            try {
                const response = await fetch(`${API_URL}/${TABLE_NAME}?select=*&limit=5`, {
                    headers: {
                        'apikey': API_KEY,
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error("Table not found or RLS policy restricting access.");
                const data = await response.json();

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-gray-400">No records found in database.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                        <td class="py-4 text-sm font-medium text-gray-900">#${item.id || 'N/A'}</td>
                        <td class="py-4 text-sm text-gray-600">${item.name || item.title || 'Data Row'}</td>
                        <td class="py-4 text-sm"><span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-bold">Active</span></td>
                        <td class="py-4 text-sm text-gray-500 text-right">${new Date(item.created_at).toLocaleDateString() || 'Today'}</td>
                    </tr>
                `).join('');

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-red-500 bg-red-50 rounded-lg">Error: ${error.message}</td></tr>`;
            }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
