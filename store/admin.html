<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sajad Printer'S - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f7;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#6416a0,#a91ccc);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
}

.container{
    width:100%;
    max-width:600px;
    margin:25px auto;
    padding:0 12px;
}

.box{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:bold;
    color:#555;
    margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #ccc;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border:2px solid #8618b5;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.preview{
    display:none;
    margin-top:12px;
    text-align:center;
}

.preview img{
    max-width:220px;
    max-height:280px;
    border-radius:12px;
    border:1px solid #ddd;
}

.upload-btn{
    width:100%;
    border:0;
    padding:15px;
    border-radius:12px;
    background:#8116ad;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    display:block;
    margin-top:12px;
    text-align:center;
    padding:13px;
    border:2px solid #8116ad;
    color:#8116ad;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
}

.notice{
    background:#fff6dc;
    color:#6c571b;
    padding:12px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:12px;
    line-height:1.5;
}

.success{
    display:none;
    background:#e7f8ed;
    color:#087a39;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.design-list{
    margin-top:25px;
}

.design-list h2{
    font-size:18px;
}

.design-item{
    background:#fafafa;
    border:1px solid #eee;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    display:flex;
    gap:12px;
    align-items:center;
}

.design-item img{
    width:70px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.design-info{
    flex:1;
}

.design-info b{
    display:block;
    margin-bottom:5px;
}

.delete-btn{
    border:0;
    background:#d32f2f;
    color:white;
    padding:8px 10px;
    border-radius:7px;
}

footer{
    text-align:center;
    padding:25px 10px;
    color:#777;
    font-size:11px;
}
</style>
</head>

<body>

<div class="header">

    <h1>🔐 Sajad Printer'S Admin</h1>

    <p>
        Online Design Store Management
    </p>

</div>


<div class="container">

<div class="box">

    <div class="title">
        Add New Design
    </div>


    <div class="notice">
        यहाँ से Design Photo, Design Number,
        Category और Price डाल सकते हैं।
    </div>


    <div class="form-group">

        <label>
            DESIGN NAME
        </label>

        <input
            type="text"
            id="designName"
            placeholder="Example: Premium Nikah Card">

    </div>


    <div class="form-group">

        <label>
            DESIGN NUMBER
        </label>

        <input
            type="text"
            id="designNumber"
            placeholder="Example: NK-001">

    </div>


    <div class="form-group">

        <label>
            CATEGORY
        </label>

        <select id="category">

            <option value="Wedding Card">
                Wedding Card
            </option>

            <option value="Nikah Card">
                Nikah Card
            </option>

            <option value="Aqiqah">
                Aqiqah
            </option>

            <option value="Flex Banner">
                Flex Banner
            </option>

            <option value="Visiting Card">
                Visiting Card
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>
            PRICE ₹
        </label>

        <input
            type="number"
            id="price"
            placeholder="Example: 99"
            min="0">

    </div>


    <div class="form-group">

        <label>
            DESCRIPTION
        </label>

        <textarea
            id="description"
            placeholder="Design के बारे में लिखें"></textarea>

    </div>


    <div class="form-group">

        <label>
            UPLOAD DESIGN PHOTO
        </label>

        <input
            type="file"
            id="designImage"
            accept="image/*"
            onchange="previewImage()">

    </div>


    <div class="preview" id="previewBox">

        <img
            id="previewPhoto"
            alt="Design Preview">

    </div>


    <button
        class="upload-btn"
        onclick="saveDesign()">

        + Add Design

    </button>


    <div
        class="success"
        id="success">

        ✓ Design Saved

    </div>


    <a
        class="back"
        href="index.html">

        ← View Design Store

    </a>


    <div class="design-list">

        <h2>
            Saved Designs
        </h2>

        <div id="designList"></div>

    </div>

</div>

</div>


<footer>
    Sajad Printer'S Admin Panel
</footer>


<script>

var selectedImage = "";


/* IMAGE PREVIEW */

function previewImage(){

    var file =
    document.getElementById("designImage")
    .files[0];

    if(!file){
        return;
    }


    var reader =
    new FileReader();


    reader.onload = function(e){

        selectedImage =
        e.target.result;

        document.getElementById(
            "previewPhoto"
        ).src = selectedImage;

        document.getElementById(
            "previewBox"
        ).style.display = "block";

    };


    reader.readAsDataURL(file);

}


/* SAVE DESIGN */

function saveDesign(){

    var name =
    document.getElementById(
        "designName"
    ).value.trim();


    var number =
    document.getElementById(
        "designNumber"
    ).value.trim();


    var category =
    document.getElementById(
        "category"
    ).value;


    var price =
    document.getElementById(
        "price"
    ).value;


    var description =
    document.getElementById(
        "description"
    ).value.trim();


    if(name === ""){

        alert("Design Name डालें");

        return;

    }


    if(number === ""){

        alert("Design Number डालें");

        return;

    }


    if(price === ""){

        alert("Price डालें");

        return;

    }


    if(selectedImage === ""){

        alert("Design Photo चुनें");

        return;

    }


    var design = {

        id: Date.now(),

        name: name,

        number: number,

        category: category,

        price: price,

        description: description,

        image: selectedImage

    };


    var designs =
    JSON.parse(
        localStorage.getItem(
            "sajadDesigns"
        )
        || "[]"
    );


    designs.unshift(design);


    try{

        localStorage.setItem(
            "sajadDesigns",
            JSON.stringify(designs)
        );

    }catch(error){

        alert(
          "Photo बहुत बड़ी है। छोटी JPG photo upload करें।"
        );

        return;

    }


    document.getElementById(
        "success"
    ).style.display = "block";


    setTimeout(function(){

        document.getElementById(
            "success"
        ).style.display = "none";

    },2500);


    clearForm();

    showDesigns();

}


/* CLEAR FORM */

function clearForm(){

    document.getElementById(
        "designName"
    ).value = "";


    document.getElementById(
        "designNumber"
    ).value = "";


    document.getElementById(
        "price"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "designImage"
    ).value = "";


    document.getElementById(
        "previewBox"
    ).style.display = "none";


    selectedImage = "";

}


/* SHOW DESIGNS */

function showDesigns(){

    var designs =
    JSON.parse(
        localStorage.getItem(
            "sajadDesigns"
        )
        || "[]"
    );


    var box =
    document.getElementById(
        "designList"
    );


    if(designs.length === 0){

        box.innerHTML =
        "<p style='color:#777'>अभी कोई Design Saved नहीं है।</p>";

        return;

    }


    var html = "";


    designs.forEach(function(item){

        html +=

        '<div class="design-item">' +

        '<img src="' +
        item.image +
        '">' +

        '<div class="design-info">' +

        '<b>' +
        item.name +
        '</b>' +

        '<small>' +
        item.number +
        ' • ' +
        item.category +
        '<br>₹' +
        item.price +
        '</small>' +

        '</div>' +

        '<button class="delete-btn" onclick="deleteDesign(' +
        item.id +
        ')">Delete</button>' +

        '</div>';

    });


    box.innerHTML = html;

}


/* DELETE DESIGN */

function deleteDesign(id){

    if(
        !confirm(
            "यह Design Delete करें?"
        )
    ){
        return;
    }


    var designs =
    JSON.parse(
        localStorage.getItem(
            "sajadDesigns"
        )
        || "[]"
    );


    designs =
    designs.filter(
        function(item){

            return item.id !== id;

        }
    );


    localStorage.setItem(
        "sajadDesigns",
        JSON.stringify(designs)
    );


    showDesigns();

}


showDesigns();

</script>

</body>
</html>
