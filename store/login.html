<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - MyStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border border-gray-100 relative">
        <div id="messageBox" class="hidden mb-4 p-3 border text-sm rounded-lg text-center font-medium"></div>

        <!-- LOGIN SECTION -->
        <div id="loginSection" class="block">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Welcome Back</h2>
            <form id="loginForm">
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                    <input type="email" id="loginEmail" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                    <input type="password" id="loginPassword" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200" required>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl">Sign In</button>
            </form>
            <p class="mt-8 text-center text-sm text-gray-500">
                Don't have an account? <button type="button" id="toSignup" class="text-indigo-600 font-bold hover:underline">Create one</button>
            </p>
        </div>

        <!-- SIGNUP SECTION -->
        <div id="signupSection" class="hidden">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Create Account</h2>
            <form id="signupForm">
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Full Name</label>
                    <input type="text" id="signupName" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200" required>
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                    <input type="email" id="signupEmail" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                    <input type="password" id="signupPassword" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200" minlength="6" required>
                </div>
                <button type="submit" id="signupBtn" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl">Create Account</button>
            </form>
            <p class="mt-8 text-center text-sm text-gray-500">
                Already have an account? <button type="button" id="toLogin" class="text-indigo-600 font-bold hover:underline">Sign In</button>
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vgblvfpzpxivwafuatcy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnYmx2ZnB6cHhpdndhZnVhdGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjA0MzQsImV4cCI6MjEwMTA5NjQzNH0.YX7aVMsiP5Lj9c29QE1qifjNo_CRiS7nQ1_VMC4hL-c';

        // Yahan variable ka naam 'supabase' se badal kar 'dbClient' kar diya hai taaki conflict na ho
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('toSignup').onclick = () => {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('signupSection').classList.remove('hidden');
        };
        document.getElementById('toLogin').onclick = () => {
            document.getElementById('signupSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        };

        function showMsg(txt, isErr = true) {
            const box = document.getElementById('messageBox');
            box.textContent = txt;
            box.className = `mb-4 p-3 border text-sm rounded-lg text-center font-medium ${isErr ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-700'}`;
            box.classList.remove('hidden');
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const { data, error } = await dbClient.auth.signInWithPassword({
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            });
            if (error) showMsg(error.message);
            else {
                localStorage.setItem('sb_token', data.session.access_token);
                window.location.href = 'admin.html';
            }
        };

        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            const { error } = await dbClient.auth.signUp({
                email: document.getElementById('signupEmail').value,
                password: document.getElementById('signupPassword').value,
                options: { data: { full_name: document.getElementById('signupName').value } }
            });
            if (error) showMsg(error.message);
            else {
                showMsg("Account created! You can now log in.", false);
                document.getElementById('signupForm').reset();
            }
        };
    </script>
</body>
</html>
