<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Sajad Printer'S</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
}

.login-box{
width:100%;
max-width:420px;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h2{
text-align:center;
margin-bottom:20px;
color:#0f172a;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
margin-top:20px;
padding:13px;
border:none;
border-radius:8px;
background:#0f62fe;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0047c7;
}

#error{
margin-top:15px;
color:red;
text-align:center;
display:none;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<label>Email</label>
<input type="email" id="email" placeholder="Enter Email">

<label>Password</label>
<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

<div id="error"></div>

</div>

<script>const supabase = window.supabase.createClient(
"https://vgblvfpzpxivwafuatcy.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnYmx2ZnB6cHhpdndhZnVhdGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjA0MzQsImV4cCI6MjEwMTA5NjQzNH0.YX7aVMsiP5Lj9c29QE1qifjNo_CRiS7nQ1_VMC4hL-c"
);

async function login(){
 alert("Login button clicked");

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const errorBox=document.getElementById("error");

errorBox.style.display="none";
errorBox.innerHTML="";

const { error } = await supabase.auth.signInWithPassword({
email: email,
password: password
});

if(error){
alert(error.message);
errorBox.style.display="block";
errorBox.innerHTML=error.message;
return;
}

window.location.href="admin.html";

}async function checkSession(){

const { data } = await supabase.auth.getSession();

if(data.session){
window.location.href = "admin.html";
}

}

checkSession();

</script>

</body>
</html>
