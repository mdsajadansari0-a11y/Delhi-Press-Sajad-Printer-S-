<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sajad Printer'S - Online Design Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172b45;
}

/* HEADER */
header{
    background:white;
    padding:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.header-box{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:55px;
    height:55px;
    border-radius:15px;
    background:linear-gradient(135deg,#0086e8,#00b9ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

.brand h2{
    color:#092e58;
}

.brand p{
    color:#7a8797;
}

.home{
    background:#07518b;
    color:white;
    padding:11px 16px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
}

/* HERO */
.hero{
    background:linear-gradient(135deg,#004a80,#008dd8);
    color:white;
    text-align:center;
    padding:45px 15px 65px;
}

.hero h1{
    font-size:40px;
    margin-bottom:10px;
}

.hero p{
    font-size:17px;
    line-height:1.6;
}

/* SEARCH */
.search-box{
    max-width:700px;
    margin:-27px auto 20px;
    padding:0 15px;
}

.search-box input{
    width:100%;
    padding:18px 20px;
    border:none;
    border-radius:17px;
    font-size:16px;
    outline:none;
    box-shadow:0 8px 25px rgba(0,0,0,.13);
}

/* CATEGORY */
.categories{
    max-width:1100px;
    margin:25px auto;
    padding:0 12px;
    display:flex;
    gap:9px;
    overflow-x:auto;
}

.categories button{
    white-space:nowrap;
    border:1px solid #dbe2ea;
    background:white;
    border-radius:30px;
    padding:11px 17px;
    font-weight:bold;
    color:#12365c;
    cursor:pointer;
}

.categories button:hover,
.categories button.active{
    background:#075b9b;
    color:white;
}

/* HEADING */
.product-heading{
    max-width:1100px;
    margin:25px auto 15px;
    padding:0 15px;
}

.product-heading h2{
    font-size:29px;
    color:#08345f;
}

#productCount{
    color:#7a8797;
    margin-top:3px;
}

/* PRODUCTS */
.products{
    max-width:1100px;
    margin:auto;
    padding:10px 12px 35px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 7px 25px rgba(0,0,0,.09);
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
    background:#eee;
}

.info{
    padding:16px;
}

.category{
    color:#0087d8;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
}

.info h3{
    margin-top:7px;
    font-size:19px;
    color:#102e50;
}

.description{
    color:#7b8795;
    font-size:13px;
    margin-top:7px;
    min-height:20px;
}

.price{
    margin-top:12px;
    font-size:25px;
    font-weight:900;
    color:#07558d;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.preview,
.buy{
    flex:1;
    text-align:center;
    padding:11px 6px;
    border-radius:10px;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

.preview{
    border:1px solid #0879bd;
    color:#0879bd;
}

.buy{
    background:#00b75b;
    color:white;
}

/* MESSAGE */
.message{
    grid-column:1/-1;
    text-align:center;
    background:white;
    padding:35px 15px;
    border-radius:15px;
    color:#758294;
}

/* ADMIN */
.admin-box{
    max-width:1100px;
    margin:10px auto 35px;
    padding:0 12px;
}

.admin-link{
    display:block;
    background:#172333;
    color:white;
    text-align:center;
    padding:15px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
}

/* FOOTER */
footer{
    background:#061d33;
    color:#aebdca;
    text-align:center;
    padding:30px 15px;
}

footer b{
    color:white;
}

/* MOBILE */
@media(max-width:500px){

    .logo{
        width:48px;
        height:48px;
    }

    .brand h2{
        font-size:18px;
    }

    .brand p{
        font-size:13px;
    }

    .home{
        padding:10px 13px;
        font-size:13px;
    }

    .hero h1{
        font-size:34px;
    }

    .hero p{
        font-size:15px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .card img{
        height:210px;
    }

    .info{
        padding:11px;
    }

    .info h3{
        font-size:15px;
    }

    .price{
        font-size:20px;
    }

    .buttons{
        display:block;
    }

    .preview,
    .buy{
        display:block;
        margin-top:7px;
    }
}

@media(max-width:360px){
    .products{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
<div class="header-box">

    <div class="brand">
        <div class="logo">DP</div>
        <div>
            <h2>DELHI PRESS</h2>
            <p>Sajad Printer'S</p>
        </div>
    </div>

    <a class="home" href="index.html">
        ← Home
    </a>

</div>
</header>


<section class="hero">

    <h1>🛍️ Design Store</h1>

    <p>
        अपनी पसंदीदा Design चुनें<br>
        और WhatsApp पर सीधे Order करें।
    </p>

</section>


<div class="search-box">
    <input
        type="search"
        id="searchInput"
        placeholder="🔍 Design search करें..."
        oninput="applyFilters()">
</div>


<div class="categories">

    <button class="active"
            onclick="setCategory('all',this)">
        All Designs
    </button>

    <button onclick="setCategory('wedding',this)">
        💍 Wedding Card
    </button>

    <button onclick="setCategory('nikah',this)">
        🕌 Nikah Card
    </button>

    <button onclick="setCategory('muslim',this)">
        🌙 Muslim Card
    </button>

    <button onclick="setCategory('aqiqah',this)">
        👶 Aqiqah
    </button>

    <button onclick="setCategory('flex',this)">
        🎨 Flex Banner
    </button>

    <button onclick="setCategory('visiting',this)">
        💳 Visiting Card
    </button>

</div>


<div class="product-heading">

    <h2>हमारे Designs</h2>

    <div id="productCount">
        Products Loading...
    </div>

</div>


<div class="products" id="products">

    <div class="message">
        ⏳ Products Loading...
    </div>

</div>


<div class="admin-box">

    <a class="admin-link"
       href="admin.html">

       🔐 Admin Panel

    </a>

</div>


<footer>

    <b>DELHI PRESS - Sajad Printer'S</b>

    <br><br>

    Online Digital Design Store

    <br><br>

    ☎ 9304509464

</footer>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://vgblvfpzpxivwafuatcy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u4PJUGojT-BQfg65WaYTFw_Gdx-MLOH";

const { createClient } = supabase;

const db =
createClient(SUPABASE_URL,SUPABASE_KEY);


let allProducts = [];

let selectedCategory = "all";


/* LOAD PRODUCTS */

async function loadProducts(){

    const box =
    document.getElementById("products");

    box.innerHTML =
    '<div class="message">⏳ Products Loading...</div>';


    const {data,error} =
    await db
    .from("products")
    .select("*")
    .order("id",{ascending:false});


    if(error){

        console.error(error);

        box.innerHTML =
        '<div class="message">❌ Product load नहीं हो पाया।</div>';

        return;
    }


    allProducts = data || [];

    applyFilters();
}


/* CATEGORY */

function setCategory(category,button){

    selectedCategory =
    category.toLowerCase();

    document
    .querySelectorAll(".categories button")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");

    applyFilters();
}


/* SEARCH + CATEGORY */

function applyFilters(){

    const search =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


    const filtered =
    allProducts.filter(product=>{

        const name =
        String(product.name || "")
        .toLowerCase();

        const category =
        String(product.category || "")
        .toLowerCase();

        const description =
        String(product.description || "")
        .toLowerCase();


        const searchMatch =
        name.includes(search) ||
        category.includes(search) ||
        description.includes(search);


        let categoryMatch = true;


        if(selectedCategory !== "all"){

            categoryMatch =
            category.includes(selectedCategory);

        }


        return searchMatch &&
               categoryMatch;

    });


    displayProducts(filtered);
}


/* DISPLAY PRODUCTS */

function displayProducts(products){

    const box =
    document.getElementById("products");

    const count =
    document.getElementById("productCount");


    count.innerText =
    products.length +
    (products.length === 1
    ? " Design Available"
    : " Designs Available");


    if(products.length === 0){

        box.innerHTML =
        '<div class="message">कोई Design नहीं मिला।</div>';

        return;
    }


    box.innerHTML = "";


    products.forEach(product=>{

        const name =
        product.name ||
        "Design";

        const category =
        product.category ||
        "Design";

        const description =
        product.description ||
        "";

        const image =
        product.image_url ||
        "";

        const price =
        product.price || 0;


        const whatsappText =
        encodeURIComponent(
        "Hello Delhi Press, मुझे यह Design Order करना है.\n\n"+
        "Design: "+name+
        "\nCategory: "+category+
        "\nPrice: ₹"+price
        );


        const whatsapp =
        "https://wa.me/919304509464?text="+
        whatsappText;


        const card =
        document.createElement("div");

        card.className = "card";


        card.innerHTML = `

        <a href="${escapeHTML(image)}"
           target="_blank">

            <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(name)}"
            loading="lazy">

        </a>


        <div class="info">

            <div class="category">
                ${escapeHTML(category)}
            </div>

            <h3>
                ${escapeHTML(name)}
            </h3>

            <div class="description">
                ${escapeHTML(description)}
            </div>

            <div class="price">
                ₹${escapeHTML(String(price))}
            </div>


            <div class="buttons">

                <a class="preview"
                   href="${escapeHTML(image)}"
                   target="_blank">

                   👁 Preview

                </a>


                <a class="buy"
                   href="${whatsapp}"
                   target="_blank">

                   💬 Order

                </a>

            </div>

        </div>
        `;


        box.appendChild(card);

    });

}


/* BASIC HTML SAFETY */

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* START */

loadProducts();

</script>

</body>
</html>
