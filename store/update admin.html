<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sajad Printer'S - Admin Panel</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#6a1b9a;color:#fff;padding:18px;text-align:center}
main{max-width:700px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
label{display:block;margin-top:12px;font-weight:bold}
input,select,textarea{width:100%;padding:10px;margin-top:5px}
button{margin-top:18px;padding:12px 18px;background:#6a1b9a;color:#fff;border:0;border-radius:8px;cursor:pointer}
.note{background:#fff8dc;padding:10px;border-radius:8px;margin-top:15px}
</style>
</head>
<body>
<header><h2>Sajad Printer'S Admin Panel</h2></header>
<main>
<h3>Add Product</h3>

<label>Product Name</label>
<input id="name">

<label>Category</label>
<select id="category">
<option>Wedding Card</option>
<option>Nikah Card</option>
<option>Muslim Card</option>
<option>Aqiqah</option>
<option>Flex Banner</option>
<option>Visiting Card</option>
</select>

<label>Price</label>
<input id="price" type="number">

<label>Description</label>
<textarea id="description"></textarea>

<label>Image URL (temporary)</label>
<input id="image">

<button onclick="saveProduct()">Save Product</button>

<div class="note">
यह Starter Admin Panel है। अगले चरण में इसमें Supabase Storage Upload,
Edit, Delete और Login जोड़ा जाएगा।
</div>
</main>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_PUBLISHABLE_KEY";

async function saveProduct(){
 alert("अभी Starter Admin Panel तैयार है। अगले चरण में Supabase Save जोड़ा जाएगा.");
}
</script>
</body>
</html>
