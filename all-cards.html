<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Cards - Sajaad Printers Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f7fe; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #0f172a; color: #fff; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 20px; font-size: 20px; font-weight: 700; color: #38bdf8; border-bottom: 1px solid #1e293b; }
        .sidebar-menu { list-style: none; padding: 20px 0; flex: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: #94a3b8; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .sidebar-menu li.active a, .sidebar-menu li a:hover { background: #1e293b; color: #fff; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .header h2 { font-size: 22px; color: #1e293b; }
        
        .container { padding: 30px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .card-item { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #cbd5e1; }
        .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 5px; }
        .card-category { font-size: 12px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; font-weight: 600; }
        .card-price { font-size: 15px; font-weight: 700; color: #059669; margin-bottom: 12px; }
        
        .delete-btn { background: #fee2e2; color: #dc2626; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
        .delete-btn:hover { background: #dc2626; color: #fff; }
        
        .no-cards { grid-column: 1 / -1; text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">Sajaad Printers</div>
        <ul class="sidebar-menu">
            <li><a href="admin.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li class="active"><a href="all-cards.html"><i class="fa-solid fa-address-card"></i> All Cards</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Manage All Cards</h2>
            <span style="color: #10b981; font-weight: 600; font-size: 14px;"><i class="fa-solid fa-circle" style="font-size: 10px;"></i> System Active</span>
        </div>

        <div class="container">
            <div class="cards-grid" id="cardsGrid">
                <!-- Cards will be loaded dynamically via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        function loadCards() {
            const grid = document.getElementById('cardsGrid');
            // LocalStorage ya Database se data fetch karne ka logic
            let cards = JSON.parse(localStorage.getItem('adminCards')) || [];

            if (cards.length === 0) {
                grid.innerHTML = `<div class="no-cards"><i class="fa-solid fa-box-open" style="font-size: 40px; margin-bottom: 10px; display: block;"></i>No cards uploaded yet. Go to Dashboard to add new designs.</div>`;
                return;
            }

            grid.innerHTML = '';
            cards.forEach((card, index) => {
                grid.innerHTML += `
                    <div class="card-item">
                        <img src="${card.image || 'https://via.placeholder.com/250x180'}" class="card-img" alt="Card Image">
                        <div class="card-body">
                            <div>
                                <div class="card-category">${card.category}</div>
                                <div class="card-title">${card.name}</div>
                                <div class="card-price">₹${card.price}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteCard(${index})">
                                <i class="fa-solid fa-trash"></i> Delete Card
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteCard(index) {
            if (confirm('Kya aap sach mein is card ko delete karna chahte hain?')) {
                let cards = JSON.parse(localStorage.getItem('adminCards')) || [];
                cards.splice(index, 1);
                localStorage.setItem('adminCards', JSON.stringify(cards));
                loadCards();
            }
        }

        window.onload = loadCards;
    </script>
</body>
</html>
